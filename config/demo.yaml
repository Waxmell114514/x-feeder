# Config used by `chorus demo`: the same pipeline over bundled documents,
# with the keyword stand-in in place of Jev. No key, no network.
db_path: .chorus/demo/demo.db
output_dir: .chorus/demo
output_lang: zh

issue_files:
  - "issues/*.yaml"

tiers:
  official:
    blend_weight: 0.30
    engagement_weighting: 0.10
    channels: [federalreserve.gov, newyorkfed.org, stlouisfed.org, bls.gov]
  pro_media:
    blend_weight: 0.25
    engagement_weighting: 0.50
    channels: [reuters.com, apnews.com, bloomberg.com, wsj.com, cnbc.com,
               ft.com, marketwatch.com]
  expert:
    blend_weight: 0.20
    engagement_weighting: 0.80
    channels: [r/AskEconomics, r/badeconomics, r/econmonitor,
               libertystreeteconomics.newyorkfed.org]
  crowd:
    blend_weight: 0.25
    engagement_weighting: 1.00
    channels: [r/economics, r/investing, r/personalfinance, r/news,
               news.ycombinator.com]

weighting:
  engagement_cap: 4.0
  speaker_cap_pct: 0.05
  channel_cap_pct: 0.35
  duplicate_damping: true
  thin_document_chars: 140
  thin_document_penalty: 0.6

thresholds:
  panel_size: 6
  min_leader_share: 0.07
  max_delegates_per_tier: 3
  phrase_similarity: 0.58
  min_phrase_docs: 2
  consensus_shift_alert: 0.08
  divergence_alert: 0.15

jev:
  offline: true
  cache_dir: .chorus/demo/jev-cache

source:
  provider: fixture
  fixture_path: fixtures/fed_rate_demo.jsonl

alerts:
  enabled: false
