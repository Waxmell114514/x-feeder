[project]
name = "chorus"
version = "0.2.0"
description = "Turn public opinion on one question into a handful of virtual opinion leaders, using public sources and TypeSafe's Jev."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "Jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chorus = "chorus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chorus = ["render/templates/*.html"]
